<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
// Mảng đã được định nghĩa sẵn
const players = [
    "Messi - Forward",
    "Ronaldo - Forward",
    "Neymar - Forward",
    "De Bruyne - Midfielder",
    "Kante - Midfielder",
    "Van Dijk - Defender",
    "Alisson - Goalkeeper"
];

// Hàm lọc theo vị trí
function filterPlayersByPosition(position, players) {
    return players.filter(function(player) {
        // Lấy phần vị trí sau dấu " - "
        const playerPosition = player.split(" - ")[1];
        return playerPosition === position;
    });
}

// Ví dụ sử dụng
console.log(filterPlayersByPosition("Midfielder", players));
console.log(filterPlayersByPosition("Forward", players));   
    </script>
</body>
</html>
