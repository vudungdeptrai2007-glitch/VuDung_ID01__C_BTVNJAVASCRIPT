<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
const players = [
    "Messi - Forward",
    "Ronaldo - Forward",
    "Neymar - Forward",
    "De Bruyne - Midfielder",
    "Kante - Midfielder",
    "Van Dijk - Defender",
    "Alisson - Goalkeeper"
];

function getUpperNames(playerNames) {
    return playerNames.map(function(player) {

        const name = player.split(" - ")[0];
        return name.toUpperCase();
    });
}

const upperNames = getUpperNames(players);
console.log(upperNames);
    </script>
</body>
</html>
