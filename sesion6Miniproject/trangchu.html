      
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
let username, password;
let maxLogin = 3;
let isLogin = false;

while (maxLogin > 0) {
  username = prompt("Nhập tài khoản:");
  password = prompt("Nhập mật khẩu:");

  if (username === "admin" && password === "12345") {
    console.log("Đăng nhập thành công!");
    isLogin = true;
    break;
  } else {
    maxLogin--;
    alert("Sai tài khoản hoặc mật khẩu! Còn " + maxLogin + " lần.");
  }
}

if (!isLogin) {
  console.log("Tài khoản đã bị khóa");
} else {

  let libraries = ["Toán", "Văn", "Anh"];
  let choice;

  do {
    choice = prompt(
      "===== MENU QUẢN LÝ THƯ VIỆN =====\n" +
      "1. Nhập thêm lô sách mới\n" +
      "2. Hiển thị danh sách sách\n" +
      "3. Tìm kiếm sách\n" +
      "4. Cập nhật tên sách\n" +
      "5. Đảo ngược thứ tự kệ sách\n" +
      "6. Nhập kho từ nguồn khác\n" +
      "7. Thoát chương trình\n" +
      "Nhập lựa chọn (1-7):"
    );

    switch (choice) {

      case "1": {
        let input = prompt("Nhập tên các sách (phân cách bằng dấu phẩy):");
        let newBooks = input.split(",").map(book => book.trim()).filter(book => book !== "");

        libraries.push(...newBooks);
        console.log(`Đã thêm ${newBooks.length} cuốn sách vào kho`);
        break;
      }

      case "2": {
        if (libraries.length === 0) {
          console.log("Kho sách trống");
        } else {
          console.log("Danh sách sách:");
          libraries.forEach((book, index) => {
            console.log(`${index + 1}. ${book}`);
          });
        }
        break;
      }
      case "3": {
        let searchName = prompt("Nhập tên sách cần tìm:");
        let index = libraries.indexOf(searchName);

        if (index !== -1) {
          console.log(`Sách "${searchName}" được tìm thấy tại vị trí ${index}`);
        } else {
          console.log("Không tìm thấy");
        }
        break;
      }

      case "4": {
        let oldName = prompt("Nhập tên sách cần sửa:");
        let index = libraries.indexOf(oldName);

        if (index !== -1) {
          let newName = prompt("Nhập tên sách mới:");
          libraries[index] = newName;
          console.log("Cập nhật tên sách thành công");
        } else {
          console.log("Sách không tồn tại");
        }
        break;
      }

      case "5": {
        libraries.reverse();
        console.log("Danh sách sách sau khi đảo:");
        libraries.forEach((book, index) => {
          console.log(`${index}: ${book}`);
        });
        break;
      }

      case "6": {
        let branchBooks = ["Sách Kỹ Năng", "Truyện Tranh"];
        libraries = libraries.concat(branchBooks);
        console.log("Đã gộp kho sách thành công");
        break;
      }

      case "7": {
        console.log("Hẹn gặp lại!");
        break;
      }

      default:
        alert("Lựa chọn không hợp lệ!");
    }

  } while (choice !== "7");
}

    </script>
</body>

</html>
