<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Todo Tết</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
}

.container {
    width: 500px;
    margin: 30px auto;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
}

.header {
    background: #d32f2f;
    color: white;
    text-align: center;
    padding: 20px;
}

.header p {
    margin-top: 5px;
    font-size: 14px;
}

.todo {
    padding: 10px;
}

.item {
    display: flex;
    align-items: center;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    cursor: pointer;
    border-left: 5px solid orange;
    background: #f5f1dc;
}

.item.done {
    background: #dce8dc;
    border-left: 5px solid green;
    color: gray;
    text-decoration: line-through;
}

.circle {
    width: 20px;
    height: 20px;
    border: 2px solid gray;
    border-radius: 50%;
    margin-right: 10px;
}

.item.done .circle {
    background: green;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.footer {
    text-align: center;
    padding: 15px;
    font-size: 13px;
    color: gray;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h2>Công việc chuẩn bị Tết</h2>
        <p>Click để đánh dấu hoàn thành</p>
    </div>

    <div class="todo" id="todoList"></div>

    <div class="footer">
        Trạng thái được lưu tự động vào localStorage • Refresh để kiểm tra
    </div>
</div>

<script>
const todoList = document.getElementById("todoList");

let initialTodos = [
    { text: "Mua bánh chưng", done: true },
    { text: "Dọn nhà đón Tết", done: true },
    { text: "Gói bánh chưng", done: false },
    { text: "Trang trí nhà cửa bằng hoa mai, hoa đào", done: false },
    { text: "Mua phong bao lì xì", done: false },
    { text: "Chuẩn bị mâm ngũ quả", done: false }
];

let todos = JSON.parse(localStorage.getItem("myTodos"));

if (!todos) {
    todos = initialTodos;
    localStorage.setItem("myTodos", JSON.stringify(todos));
}

// render
function render() {
    todoList.innerHTML = "";

    todos.forEach((todo, index) => {
        let div = document.createElement("div");
        div.className = "item";

        if (todo.done) {
            div.classList.add("done");
        }

        div.innerHTML = `
            <div class="circle">${todo.done ? "✓" : ""}</div>
            <span>${todo.text}</span>
        `;

        div.onclick = function () {
            todos[index].done = !todos[index].done;

            localStorage.setItem("myTodos", JSON.stringify(todos));

            render();
        };

        todoList.appendChild(div);
    });
}

render();
</script>

</body>
</html>
