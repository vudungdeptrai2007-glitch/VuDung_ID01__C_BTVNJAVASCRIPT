<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let tenSach = prompt("Nhập tên sách:");
let tenNguoiMuon = prompt("Nhập tên người mượn:");

let tinhTrangSach = prompt(
    "Nhập tình trạng sách (có sẵn / đã mượn / không có sẵn):"
).toLowerCase();

let soNgayMuon = Number(prompt("Nhập số ngày mượn:"));

let coTheThuVien = prompt(
    "Bạn có thẻ thư viện không? (có / không):"
).toLowerCase();

if (tinhTrangSach === "có sẵn") {
    if (coTheThuVien === "có") {
        console.log("Chúc mừng, bạn có thể mượn sách này");
    } else {
        console.log("Bạn không thể mượn sách nếu không có thẻ thư viện");
    }

} else if (tinhTrangSach === "đã mượn") {
    if (soNgayMuon < 30) {
        if (coTheThuVien === "có") {
            console.log("Sách đang được mượn, vui lòng đợi đến khi trả lại");
        } else {
            console.log("Bạn không thể mượn sách nếu không có thẻ thư viện");
        }
    } else {
        console.log("Sách đã được mượn quá lâu");
    }

} else if (tinhTrangSach === "không có sẵn") {
    console.log("Sách này hiện tại không có sẵn trong thư viện, bạn có thể đăng ký mượn sau");

} else {
    console.log("Thông tin không hợp lệ, vui lòng nhập lại");
}

    </script>
</body>
</html>
