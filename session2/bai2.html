<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

let bookCountInput = prompt("Nhập số lượng sách trong thư viện:");

let bookCount = Number(bookCountInput);

let message = "";

if (bookCount < 10) {
  message = "Thư viện có ít sách";
} else if (bookCount >= 10 && bookCount <= 20) {
  message = "Thư viện có số lượng sách vừa đủ";
} else if (bookCount > 20) {
  message = "Thư viện có nhiều sách";
} else {
  message = "Số lượng sách không hợp lệ";
}

console.log(message);

    </script>
    
</body>
</html>
