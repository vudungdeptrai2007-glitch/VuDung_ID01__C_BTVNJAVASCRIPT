<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let booksId = [];
let booksName = [];
let booksCategory = [];
let inventoryQuantity = [];

let n = parseInt(prompt("Có bao nhiêu loại sách cần nhập thông tin hôm nay? "));
while (isNaN(n) || n <= 0) {
    n = parseInt(prompt("Nhập lại số lượng sách (số nguyên dương): "));
}

for (let i = 0; i < n; i++) {
    let id;
    do {
        id = prompt(`Nhập mã sách thứ ${i + 1}: `).trim();
    } while (id === "" || booksId.includes(id));

    let name;
    do {
        name = prompt(`Nhập tên sách thứ ${i + 1}: `).trim();
    } while (name === "");

    let category = prompt(`Nhập các thể loại của sách thứ ${i + 1} (các thể loại cách nhau bởi dấu phẩy): `).trim();

    let quantity;
    do {
        quantity = parseInt(prompt(`Nhập số lượng tồn kho của sách thứ ${i + 1}: `));
    } while (isNaN(quantity) || quantity < 0);

    booksId.push(id);
    booksName.push(name);
    booksCategory.push(category);
    inventoryQuantity.push(quantity);
}

let countLapTrinh = 0;
for (let i = 0; i < n; i++) {
    if (booksCategory[i].toLowerCase().includes("lập trình")) {
        countLapTrinh++;
    }
}

console.log(`Tổng số sách thuộc thể loại 'Lập trình': ${countLapTrinh}`);

console.log("Danh sách mã sách thuộc cả hai thể loại 'JavaScript' và 'Web':");
for (let i = 0; i < n; i++) {
    let cat = booksCategory[i].toLowerCase();
    if (cat.includes("javascript") && cat.includes("web")) {
        console.log(booksId[i]);
    }
}

let minIndex = 0;
for (let i = 1; i < n; i++) {
    if (inventoryQuantity[i] < inventoryQuantity[minIndex]) {
        minIndex = i;
    }
}

console.log("Loại sách có số lượng tồn kho thấp nhất:");
console.log(
    `Mã sách: ${booksId[minIndex]}, Tên sách: ${booksName[minIndex]}, Tồn kho: ${inventoryQuantity[minIndex]}`
);

    </script>
</body>
</html>
