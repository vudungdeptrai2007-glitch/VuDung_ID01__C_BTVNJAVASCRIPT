<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // ====== DỮ LIỆU ======
let players = [];
let goals = [];

// ====== HÀM 1: THÊM CẦU THỦ ======
function addPlayer(name, goal) {
    players.push(name);
    goals.push(goal);
    console.log(`=> Đã thêm ${name} thành công.`);
}

// ====== HÀM 2: HIỂN THỊ ĐỘI HÌNH ======
function showSquad() {
    if (players.length === 0) {
        console.log("=> Danh sách đội bóng đang trống.");
        return;
    }

    console.log("=== DANH SÁCH ĐỘI HÌNH ===");
    for (let i = 0; i < players.length; i++) {
        console.log(`${i + 1}. ${players[i]} - ${goals[i]} bàn`);
    }
}

// ====== HÀM 3: TÍNH TỔNG BÀN THẮNG (Function Expression) ======
const getTotalGoals = function () {
    let total = 0;
    for (let i = 0; i < goals.length; i++) {
        total += goals[i];
    }
    return total;
};

// ====== HÀM 4: TÌM SỐ BÀN THẮNG CAO NHẤT ======
function findMostGoals(goalsArray) {
    if (goalsArray.length === 0) return 0;

    let max = goalsArray[0];
    for (let i = 1; i < goalsArray.length; i++) {
        if (goalsArray[i] > max) {
            max = goalsArray[i];
        }
    }
    return max;
}

function main() {
    let choice;

    do {
        choice = prompt(
            "--- QUẢN LÝ ĐỘI BÓNG ---\n" +
            "1. Nhập cầu thủ mới\n" +
            "2. Xem danh sách đội hình\n" +
            "3. Xem thành tích toàn đội\n" +
            "4. Tìm Vua phá lưới\n" +
            "0. Thoát\n\n" +
            "Người dùng chọn:"
        );

        switch (choice) {
            case "1":
                let name = prompt("Nhập tên cầu thủ:");
                let goal = parseInt(prompt("Nhập số bàn thắng:"));
                if (!isNaN(goal)) {
                    addPlayer(name, goal);
                } else {
                    console.log("❌ Số bàn thắng không hợp lệ.");
                }
                break;

            case "2":
                showSquad();
                break;

            case "3":
                let totalGoals = getTotalGoals();
                console.log(`=> Tổng số bàn thắng của cả đội là: ${totalGoals} bàn.`);
                break;

            case "4":
                let maxGoals = findMostGoals(goals);
                if (players.length === 0) {
                    console.log("=> Chưa có cầu thủ nào.");
                } else {
                    let index = goals.indexOf(maxGoals);
                    console.log(`=> Vua phá lưới hiện tại: ${players[index]} với ${maxGoals} bàn.`);
                }
                break;

            case "0":
                console.log("👋 Thoát chương trình.");
                break;

            default:
                console.log("❌ Lựa chọn không hợp lệ.");
        }
    } while (choice !== "0");
}

// ====== CHẠY CHƯƠNG TRÌNH ======
main();

    </script>
</body>
</html>
