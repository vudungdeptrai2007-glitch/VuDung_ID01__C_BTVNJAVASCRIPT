<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let players = [];

let n = parseInt(prompt("Có bao nhiêu cầu thủ cần nhập vào đội bóng?"));

for (let i = 0; i < n; i++) {
    let id;
    let duplicate;

    do {
        duplicate = false;
        id = prompt("Nhập mã cầu thủ:");
        for (let j = 0; j < players.length; j++) {
            let parts = players[j].split("-");
            if (parts[0] === id) {
                duplicate = true;
                alert("Mã cầu thủ đã tồn tại, nhập lại!");
                break;
            }
        }
    } while (duplicate);

    let name;
    do {
        name = prompt("Nhập tên cầu thủ:");
    } while (name.trim() === "");

    let pos;
    do {
        pos = parseInt(prompt(
            "Nhập vị trí:\n1. Thủ môn\n2. Hậu vệ\n3. Tiền vệ\n4. Tiền đạo"
        ));
    } while (pos < 1 || pos > 4);

    let position = "";
    if (pos === 1) position = "Thủ môn";
    else if (pos === 2) position = "Hậu vệ";
    else if (pos === 3) position = "Tiền vệ";
    else position = "Tiền đạo";

    players.push(id + "-" + name + "-" + position);
}

function printTeamRoster() {
    for (let i = 0; i < players.length; i++) {
        let parts = players[i].split("-");
        console.log(
            (i + 1) + ". Mã: " + parts[0] +
            " | Tên: " + parts[1] +
            " | Vị trí: " + parts[2]
        );
    }
}

function pushPlayer(name, position) {
    let id;
    let duplicate;

    do {
        duplicate = false;
        id = prompt("Nhập mã cầu thủ mới:");
        for (let i = 0; i < players.length; i++) {
            if (players[i].split("-")[0] === id) {
                duplicate = true;
                alert("Mã cầu thủ đã tồn tại!");
                break;
            }
        }
    } while (duplicate);

    players.push(id + "-" + name + "-" + position);
}

printTeamRoster();

    </script>
</body>
</html>
