<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let players = [
    "P001-Nguyễn Văn A-Thủ môn",
    "P002-Trần Văn B-Hậu vệ",
    "P003-Lê C-Tiền vệ",
    "P004-Phạm Hoàng D-Tiền đạo",
    "P005-Nguyễn Hoàng Long-Tiền đạo"
];

function getShortestPlayerName() {
    let shortestName = players[0].split("-")[1];

    for (let i = 1; i < players.length; i++) {
        let name = players[i].split("-")[1];
        if (name.length < shortestName.length) {
            shortestName = name;
        }
    }
    return shortestName;
}

function countPlayersWithPositionLengthGreaterThan(length) {
    let count = 0;

    for (let i = 0; i < players.length; i++) {
        let position = players[i].split("-")[2];
        if (position.length > length) {
            count++;
        }
    }
    return count;
}

console.log("Tên cầu thủ ngắn nhất:", getShortestPlayerName());
console.log(
    "Số cầu thủ có tên vị trí dài hơn 7 ký tự:",
    countPlayersWithPositionLengthGreaterThan(7)
);

    </script>
</body>
</html>
