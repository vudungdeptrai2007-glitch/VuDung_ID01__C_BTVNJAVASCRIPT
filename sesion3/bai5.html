<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let tongYeuCau = 0;
let soThanhCong = 0;
let soTuChoi = 0;
let soChoXetDuyet = 0;

while (true) {
    let tiepTuc = prompt(
        "Có yêu cầu đặt mượn trước mới không? (có/không)"
    ).toLowerCase();

    if (tiepTuc === "không") {
        break;
    }

    if (tiepTuc !== "có") {
        alert("Vui lòng nhập 'có' hoặc 'không'");
        continue;
    }

    tongYeuCau++;

    let tenBanDoc = prompt("Nhập tên bạn đọc:");
    let maSach = prompt("Nhập mã sách muốn đặt trước:");
    let tenSach = prompt("Nhập tên sách:");
    let soNgayCho = parseInt(prompt("Nhập số ngày dự kiến chờ:"));
    let uuTien = parseInt(
        prompt("Nhập mức ưu tiên (1: SV, 2: GV/NCS, 3: Đặc cách):")
    );

    if (soNgayCho > 45) {
        console.log("Từ chối: Thời gian chờ quá lâu (>45 ngày)");
        soTuChoi++;
    }
    else if (uuTien === 3) {
        console.log("Đặt trước thành công - Ưu tiên đặc cách cao nhất");
        soThanhCong++;
    }
    else if (uuTien === 2 && soNgayCho <= 30) {
        console.log("Đặt trước thành công - Ưu tiên giảng viên/nghiên cứu");
        soThanhCong++;
    }
    else if (uuTien === 1 && soNgayCho <= 21) {
        console.log("Đặt trước thành công");
        soThanhCong++;
    }
    else {
        console.log("Đặt trước tạm thời - Chờ xét duyệt thêm");
        soChoXetDuyet++;
    }
}

console.log("===== BÁO CÁO CUỐI CA =====");
console.log("Tổng số yêu cầu đã xử lý: " + tongYeuCau);
console.log("Số yêu cầu đặt trước thành công: " + soThanhCong);
console.log("Số yêu cầu bị từ chối: " + soTuChoi);
console.log("Số yêu cầu chờ xét duyệt: " + soChoXetDuyet);

    </script>
</body>
</html>
